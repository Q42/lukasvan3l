<!-- Maskable variant: full-bleed achtergrond en alle inhoud binnen de veilige
     zone (middelste 80%), zodat Android er elke vorm uit kan snijden.
     Bron voor icons/maskable-512.png. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2b705"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0d4f7c"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6cbf84"/><stop offset="1" stop-color="#2d7a3a"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#1c1c1c"/>

  <rect x="128" y="128" width="116" height="116" rx="26" fill="url(#g1)"/>
  <rect x="268" y="128" width="116" height="116" rx="26" fill="url(#g2)"/>
  <rect x="128" y="268" width="116" height="116" rx="26" fill="url(#g3)"/>
  <rect x="268" y="268" width="116" height="116" rx="26" fill="url(#g4)"/>
</svg>
